spring.application.name=product-service
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost/bd_product
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.locations=classpath:/db_migration


eureka.client.service-url.default-zone=http://localhost:8781/eureka

eureka.instance.prefer-ip-address=true

eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microservice Java 2026
info.app.autor=Kauê Anacleto Saggiorato

eureka.instance.metadata-map.github.repo=KaueSaggiorato/Microservices-Java

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true